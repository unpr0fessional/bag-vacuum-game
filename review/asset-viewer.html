<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка 3D-модели</title><style>body{margin:0;background:#afb8b7;font:12px system-ui}canvas{display:block}#bar{position:fixed;left:12px;top:12px;display:flex;gap:5px}button{background:#202523;color:white;border:0;border-radius:3px;padding:9px;cursor:pointer}#info{position:fixed;right:12px;top:12px;max-width:280px;max-height:85vh;overflow:auto;background:#fff9;padding:12px;white-space:pre-wrap;font-size:11px}</style><div id="bar"><button data-view="front">Спереди</button><button data-view="back">Сзади</button><button data-view="left">Слева</button><button data-view="right">Справа</button><button id="motion">Анимация</button></div><pre id="info">Загрузка модели</pre><script src="../vendor/three.min.js"></script><script src="../vendor/GLTFLoader.js"></script><script src="../vendor/OrbitControls.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb6bfbc);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.02,30);camera.position.set(0,1.2,3.5);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);
scene.add(new THREE.HemisphereLight(0xeaf5fa,0x7e756b,1));const key=new THREE.DirectionalLight(0xffeee0,1.1);key.position.set(-2,3,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const rim=new THREE.DirectionalLight(0xe0eeff,.5);rim.position.set(2,2,-2);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0xb8bfba,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
let mixer,clock=new THREE.Clock(),animate=false,model;const asset=new URLSearchParams(location.search).get('asset')||'hero';
new THREE.GLTFLoader().load('../assets/models/'+asset+'.glb',g=>{
model=g.scene;scene.add(model);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
const scale=(asset==='bag'?.75:1.74)/size.y;model.scale.multiplyScalar(scale);model.position.add(new THREE.Vector3(-center.x*scale,-bounds.min.y*scale,-center.z*scale));
const post=new THREE.Box3().setFromObject(model);const postSize=post.getSize(new THREE.Vector3());
const bones=[],mats=[],meshes=[];model.traverse(o=>{if(o.isBone)bones.push(o.name);if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;o.visible=true;meshes.push({name:o.name,vertices:o.geometry.attributes.position.count,skinned:!!o.isSkinnedMesh});for(const m of Array.isArray(o.material)?o.material:[o.material])mats.push({name:m.name,color:m.color?.getHexString(),map:!!m.map,normal:!!m.normalMap,roughness:m.roughness,metalness:m.metalness});if(asset==='hero'&&o.isSkinnedMesh){const source=Array.isArray(o.material)?o.material:[o.material];const material=source.length===1?source[0].clone():source.map(m=>m.clone());for(const m of Array.isArray(material)?material:[material]){m.skinning=false;m.needsUpdate=true;}const staticMesh=new THREE.Mesh(o.geometry,material);staticMesh.position.copy(o.position);staticMesh.quaternion.copy(o.quaternion);staticMesh.scale.copy(o.scale);staticMesh.frustumCulled=false;staticMesh.castShadow=staticMesh.receiveShadow=true;o.parent.add(staticMesh);o.visible=false;}}});
if(g.animations.length){mixer=new THREE.AnimationMixer(model);mixer.clipAction(g.animations[0]).play();}
document.getElementById('info').textContent=JSON.stringify({size:size.toArray(),postSize:postSize.toArray(),postMin:post.min.toArray(),postMax:post.max.toArray(),position:model.position.toArray(),scale: model.scale.toArray(),animations:g.animations.map(a=>({name:a.name,duration:a.duration,tracks:a.tracks.map(t=>t.name)})),meshes,materials:mats,bones},null,2);
},undefined,e=>document.getElementById('info').textContent='Ошибка загрузки: '+e.message);
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const a={front:0,back:Math.PI,left:-Math.PI/2,right:Math.PI/2}[b.dataset.view];camera.position.set(Math.sin(a)*3.5,1.2,Math.cos(a)*3.5);controls.target.set(0,.9,0);controls.update();});document.getElementById('motion').onclick=()=>animate=!animate;
function frame(){requestAnimationFrame(frame);let dt=clock.getDelta();if(mixer&&animate)mixer.update(Math.min(dt,.05));controls.update();renderer.render(scene,camera);}frame();
onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
</script></html>
